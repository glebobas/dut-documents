<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Архив документов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: узкая колонка, реестр документов строками с тонкими разделителями */
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --fg: #1b2127;
    --muted: #66717c;
    --line: #dde1e5;
    --accent: #1f5f8b;
    --accent-soft: #e3eef6;
    --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171b;
      --surface: #1a2025;
      --fg: #e6eaed;
      --muted: #8f9aa4;
      --line: #2b333a;
      --accent: #6fb1dc;
      --accent-soft: #1d2f3c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171b;
    --surface: #1a2025;
    --fg: #e6eaed;
    --muted: #8f9aa4;
    --line: #2b333a;
    --accent: #6fb1dc;
    --accent-soft: #1d2f3c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 48px 64px;
  }
  main { max-width: 720px; margin-inline: auto; }

  header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .lead { margin: 0; color: var(--muted); max-width: 52ch; }

  .search { display: block; margin-bottom: 12px; }
  .search input {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 16px;
    row-gap: 2px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .num {
    grid-row: 1 / span 2;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .meta {
    grid-column: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .tag {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .action { grid-column: 3; grid-row: 1 / span 2; }
  .open {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
    font-size: 14px;
    text-decoration: none;
  }
  .open:hover { text-decoration: underline; }
  .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pending { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  footer { margin-top: 20px; font-size: 13px; color: var(--muted); }

  @media (max-width: 520px) {
    body { padding-block: 32px 48px; }
    h1 { font-size: 24px; }
    .row { grid-template-columns: minmax(0, 1fr); }
    .num { grid-row: auto; }
    .meta, .action { grid-column: 1; grid-row: auto; }
    .action { margin-top: 8px; }
  }
</style>

<main>
  <header>
    <h1>Архив документов</h1>
    <p class="lead">Выберите документ из списка и откройте его для просмотра.</p>
  </header>

  <label class="search" for="q">
    <input id="q" type="search" placeholder="Найти документ" autocomplete="off">
  </label>

  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>Ничего не найдено.</p>

  <footer id="count"></footer>
</main>

<script>
  // Чтобы подключить файл, укажите путь в поле file, например "files/doc-01.pdf".
  var DOCS = [
    { code: "01", title: "Название документа 1", type: "pdf", date: "дд.мм.гггг", file: "" },
    { code: "02", title: "Название документа 2", type: "pdf", date: "дд.мм.гггг", file: "" },
    { code: "03", title: "Название документа 3", type: "docx", date: "дд.мм.гггг", file: "" },
    { code: "04", title: "Название документа 4", type: "pdf", date: "дд.мм.гггг", file: "" },
    { code: "05", title: "Название документа 5", type: "xlsx", date: "дд.мм.гггг", file: "" },
    { code: "06", title: "Название документа 6", type: "pdf", date: "дд.мм.гггг", file: "" }
  ];

  var list = document.getElementById("list");
  var empty = document.getElementById("empty");
  var count = document.getElementById("count");
  var input = document.getElementById("q");

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render(items) {
    list.textContent = "";
    items.forEach(function (d) {
      var li = el("li", "row");
      li.appendChild(el("span", "num", "№ " + d.code));
      li.appendChild(el("span", "title", d.title));

      var meta = el("span", "meta");
      meta.appendChild(el("span", "tag", d.type));
      meta.appendChild(el("span", "", d.date));
      li.appendChild(meta);

      var action = el("span", "action");
      if (d.file) {
        var a = el("a", "open", "Открыть");
        a.href = d.file;
        a.target = "_blank";
        a.rel = "noopener";
        action.appendChild(a);
      } else {
        action.appendChild(el("span", "pending", "Файл не загружен"));
      }
      li.appendChild(action);
      list.appendChild(li);
    });
    empty.hidden = items.length > 0;
    list.hidden = items.length === 0;
    count.textContent = "Документов: " + items.length + " из " + DOCS.length;
  }

  input.addEventListener("input", function () {
    var q = input.value.trim().toLowerCase();
    render(DOCS.filter(function (d) {
      return !q || d.title.toLowerCase().indexOf(q) !== -1 || d.code.indexOf(q) !== -1;
    }));
  });

  render(DOCS);
</script>

</body></html>
